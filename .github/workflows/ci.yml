name: Elora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check src/server.js
      - run: node --check src/controllers/storeController.js
      - run: node --check src/controllers/authController.js
      - run: node --check src/controllers/orderController.js
      - run: node --check src/controllers/adminController.js
      - run: node --check src/middleware/auth.js
      - run: node --check src/seed/seedAdmin.js
      - run: node --check src/seed/seedProducts.js
